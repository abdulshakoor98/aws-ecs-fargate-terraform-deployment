<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS ECS Web App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            max-width: 600px;
        }

        h1 {
            color: #222;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #198754;
            color: white;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>AWS ECS Web Application</h1>

        <p>
            Application successfully deployed using
            Docker, Amazon ECR, ECS Fargate and ALB.
        </p>

        <div class="status">
            Application Running
        </div>
    </div>

</body>
</html>
